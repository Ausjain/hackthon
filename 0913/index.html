<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fffaf2" />
    <title>은평 한마디 지도</title>
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="은평 한마디 지도 처음으로">
          <span class="brand-mark" aria-hidden="true">📍</span>
          <span><strong>은평 한마디 지도</strong><small>우리 동네를 더 좋은 곳으로</small></span>
        </a>
        <div class="topbar-actions">
          <span class="count-badge"><b id="pinCount">0</b>개의 이야기</span>
          <button class="help-button" id="helpButton" type="button">사용 방법</button>
        </div>
      </header>

      <main class="main-layout">
        <aside class="sidebar" aria-label="지도 안내와 분류">
          <section class="intro-card">
            <span class="eyebrow">EUNPYEONG VOICE MAP</span>
            <h1>은평구의 장소에<br /><em>여러분의 생각</em>을 남겨주세요.</h1>
            <p>지도의 원하는 곳을 누르고, 그 장소에 대한 솔직한 의견을 공유해 보세요.</p>
            <div class="how-to">
              <span class="step-number">1</span>
              <div><strong>지도에서 장소를 클릭</strong><small>은평구 안의 원하는 위치를 골라요</small></div>
            </div>
            <div class="how-to">
              <span class="step-number">2</span>
              <div><strong>의견을 작성하고 등록</strong><small>장소 이름과 생각을 적으면 끝!</small></div>
            </div>
          </section>

          <section class="category-card">
            <div class="section-heading"><h2>분류별 보기</h2><button id="showAllButton" type="button">전체 보기</button></div>
            <div class="category-list" id="categoryList">
              <button class="category-filter active" data-category="전체" type="button"><span class="category-icon all">●</span><span>전체 의견</span><b id="allCount">0</b></button>
              <button class="category-filter" data-category="좋아요" type="button"><span class="category-icon like">♥</span><span>좋아요</span><b id="likeCount">0</b></button>
              <button class="category-filter" data-category="불편해요" type="button"><span class="category-icon inconvenient">!</span><span>불편해요</span><b id="inconvenientCount">0</b></button>
              <button class="category-filter" data-category="추천해요" type="button"><span class="category-icon recommend">★</span><span>추천해요</span><b id="recommendCount">0</b></button>
              <button class="category-filter" data-category="바뀌었으면 해요" type="button"><span class="category-icon change">↻</span><span>바뀌었으면 해요</span><b id="changeCount">0</b></button>
            </div>
          </section>
        </aside>

        <section class="map-panel" aria-label="은평구 의견 지도">
          <div id="map"></div>
          <div class="place-search" id="placeSearch">
            <form class="search-form" id="searchForm" role="search">
              <span class="search-icon" aria-hidden="true">⌕</span>
              <label class="sr-only" for="searchInput">은평구 장소 또는 주소 검색</label>
              <input id="searchInput" type="search" minlength="2" maxlength="80" autocomplete="off" placeholder="은평구 장소명 또는 주소 검색" />
              <button class="search-clear" id="searchClearButton" type="button" aria-label="검색어 지우기" hidden>×</button>
              <button class="search-submit" type="submit">검색</button>
            </form>
            <div class="search-results" id="searchResults" hidden aria-live="polite"></div>
          </div>
          <div class="map-tip" id="mapTip"><span>＋</span><strong>지도를 클릭해 의견을 남겨보세요</strong><button type="button" aria-label="안내 닫기">×</button></div>
          <button class="reset-view" id="resetViewButton" type="button" title="은평구 전체 보기" aria-label="은평구 전체 보기">⌖</button>
          <div class="map-status"><span class="pulse-dot"></span>은평구 안에서만 핀을 등록할 수 있어요</div>
        </section>
      </main>
    </div>

    <div class="modal-backdrop" id="pinModal" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <header class="modal-header"><div><span class="eyebrow">NEW PLACE STORY</span><h2 id="modalTitle">이 장소에 대한 의견</h2></div><button class="close-button" id="closeModalButton" type="button" aria-label="닫기">×</button></header>
        <form id="pinForm">
          <div class="modal-body">
            <div class="selected-location"><span>📍</span><div><small>선택한 위치</small><strong id="selectedCoordinates"></strong></div></div>
            <label class="form-field"><span>장소 이름 <b>*</b></span><input id="placeName" maxlength="40" required placeholder="예: 불광천 산책로" autocomplete="off" /></label>
            <fieldset class="form-field"><legend>분류 <b>*</b></legend><div class="category-options">
              <label><input type="radio" name="category" value="좋아요" required /><span><i class="category-icon like">♥</i>좋아요</span></label>
              <label><input type="radio" name="category" value="불편해요" /><span><i class="category-icon inconvenient">!</i>불편해요</span></label>
              <label><input type="radio" name="category" value="추천해요" /><span><i class="category-icon recommend">★</i>추천해요</span></label>
              <label><input type="radio" name="category" value="바뀌었으면 해요" /><span><i class="category-icon change">↻</i>바뀌었으면 해요</span></label>
            </div></fieldset>
            <label class="form-field"><span>나의 의견 <b>*</b></span><textarea id="opinion" maxlength="200" required placeholder="이 장소에 대해 어떤 생각을 갖고 있나요?"></textarea><small class="char-count"><b id="charCount">0</b> / 200</small></label>
          </div>
          <footer class="modal-footer"><button class="cancel-button" id="cancelButton" type="button">취소</button><button class="submit-button" type="submit">핀 등록하기 <span>→</span></button></footer>
        </form>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="app.js"></script>
  </body>
</html>
