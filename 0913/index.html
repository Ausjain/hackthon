<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fffaf2" />
    <title>지역 한마디 지도</title>
    <link rel="preconnect" href="https://maps.googleapis.com" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" id="brandLink" aria-label="한마디 지도 처음으로">
          <span class="brand-mark" aria-hidden="true">📍</span>
          <span><strong id="brandTitle">한마디 지도</strong><small id="brandSubtitle">우리 동네를 더 좋은 곳으로</small></span>
        </a>
        <div class="topbar-actions">
          <span class="count-badge"><b id="pinCount">0</b>개의 장소</span>
          <button class="help-button" id="helpButton" type="button">사용 방법</button>
        </div>
      </header>

      <main class="main-layout">
        <aside class="sidebar" aria-label="지도 사용 안내">
          <section class="intro-card">
            <span class="eyebrow" id="regionEnglishName">LOCAL VOICE MAP</span>
            <h1><span id="regionHeading">우리 지역</span>의 장소에<br /><em>여러분의 생각</em>을 남겨주세요.</h1>
            <p>지도의 원하는 곳을 누르고, 그 장소에 대한 솔직한 의견을 공유해 보세요.</p>
            <div class="how-to">
              <span class="step-number">1</span>
              <div><strong>지도에서 장소를 클릭</strong><small><span id="regionStepName">지역</span> 안의 원하는 위치를 골라요</small></div>
            </div>
            <div class="how-to">
              <span class="step-number">2</span>
              <div><strong>장소를 추가하고 이야기 나누기</strong><small>반응을 누르거나 댓글을 남겨요</small></div>
            </div>
          </section>

          <section class="simple-guide">
            <span aria-hidden="true">💬</span>
            <p><strong>핀을 눌러보세요!</strong><small>좋아요·불편해요 반응과 댓글을 남길 수 있어요.</small></p>
          </section>
        </aside>

        <section class="map-panel" id="mapPanel" aria-label="지역 의견 지도">
          <div id="map"></div>
          <div class="place-search" id="placeSearch">
            <form class="search-form" id="searchForm" role="search">
              <span class="search-icon" aria-hidden="true">⌕</span>
              <label class="sr-only" id="searchLabel" for="searchInput">지역 장소 또는 주소 검색</label>
              <input id="searchInput" type="search" minlength="2" maxlength="80" autocomplete="off" placeholder="장소명 또는 주소 검색" />
              <button class="search-clear" id="searchClearButton" type="button" aria-label="검색어 지우기" hidden>×</button>
              <button class="search-submit" type="submit">검색</button>
            </form>
            <div class="search-results" id="searchResults" hidden aria-live="polite"></div>
          </div>
          <div class="map-tip" id="mapTip"><span>＋</span><strong>지도를 클릭해 의견을 남겨보세요</strong><button type="button" aria-label="안내 닫기">×</button></div>
          <button class="reset-view" id="resetViewButton" type="button" title="초기 위치로 이동" aria-label="초기 위치로 이동">⌖</button>
          <div class="map-status"><span class="pulse-dot"></span><span id="mapStatusText">설정 지역 안에서만 핀을 등록할 수 있어요</span></div>
        </section>
      </main>
    </div>

    <div class="modal-backdrop" id="pinModal" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <header class="modal-header"><div><span class="eyebrow">NEW PLACE</span><h2 id="modalTitle">새 장소 추가</h2></div><button class="close-button" id="closeModalButton" type="button" aria-label="닫기">×</button></header>
        <form id="pinForm">
          <div class="modal-body">
            <div class="selected-location"><span>📍</span><div><small>선택한 위치</small><strong id="selectedCoordinates"></strong></div></div>
            <label class="form-field"><span>장소 이름 <b>*</b></span><input id="placeName" maxlength="40" required placeholder="예: 불광천 산책로" autocomplete="off" /></label>
            <label class="form-field"><span>첫 댓글 <small>(선택)</small></span><textarea id="opinion" maxlength="200" placeholder="친구들에게 알려주고 싶은 내용을 적어보세요."></textarea><small class="char-count"><b id="charCount">0</b> / 200</small></label>
          </div>
          <footer class="modal-footer"><button class="cancel-button" id="cancelButton" type="button">취소</button><button class="submit-button" type="submit">장소 추가하기 <span>→</span></button></footer>
        </form>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
